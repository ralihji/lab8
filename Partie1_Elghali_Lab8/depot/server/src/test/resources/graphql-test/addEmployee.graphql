# Copie exacte de ADD_EMPLOYEE (client/src/app/service/employee.service.ts)
mutation addEmployee($name: String!,
  $dateOfBirth: String!,
  $city: String!,
  $salary: Float!,
  $gender: String!,
  $email: String!) {
  newEmployee(createEmployeeInput: {name: $name, dateOfBirth: $dateOfBirth, city: $city, salary: $salary, gender: $gender, email: $email}) {
    id
    name
    dateOfBirth
    city
    salary
    gender
    email
  }
}
